name: Transfer verified rc50 draft assets
on:
  workflow_dispatch:
permissions: {}
jobs:
  upload-verified-assets:
    if: github.ref == 'refs/heads/codex/rc50-ci-asset-upload'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Transfer original main CI bytes into the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/rc50_asset_upload.py
      - uses: actions/upload-artifact@v4
        with:
          name: rc50-draft-asset-transfer-${{ github.run_id }}
          path: runtime/rc50-asset-transfer/receipt.json
          if-no-files-found: error
