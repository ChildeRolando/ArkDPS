name: Windows regression and WPF portable candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.10'
          architecture: x64
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned candidate toolchain
        run: python -m pip install -r requirements-windows.txt -r requirements-test.txt
      - name: Prepare isolated native-test desktop
        run: python tools/prepare_windows_ci.py
      - name: Native Windows regression
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests -q --assert=plain
      - name: Build WPF desktop (net10.0-windows)
        run: dotnet build desktop/ArkDPS.Desktop/ArkDPS.Desktop.csproj --configuration Release --nologo
      - name: Build WPF portable package (the only distribution entry)
        run: python tools/package_windows.py --output runtime/ci-build
      - name: Verify WPF source acceptance
        run: python acceptance/verify_wpf.py --output runtime/wpf-source
      - name: Verify WPF portable package
        shell: pwsh
        run: |
          $zip = (Get-ChildItem runtime/ci-build/*.zip | Select-Object -First 1).FullName
          python acceptance/verify_wpf_package.py $zip --output runtime/package-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-wpf-candidate-${{ github.sha }}
          path: |
            runtime/ci-build/*.zip
            runtime/ci-build/*.sha256
            runtime/ci-build/ArkDPS-win-x64-*/release.json
            runtime/wpf-source/
            runtime/package-validation/
          if-no-files-found: warn
